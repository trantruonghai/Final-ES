<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Detail</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 380px;
            transition: 0.3s;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .info {
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f7fa;
            border-radius: 8px;
        }

        .info strong {
            color: #555;
        }

        .info span {
            display: block;
            margin-top: 3px;
            color: #222;
        }

        .btn {
            display: block;
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            background: #4A90E2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #357ABD;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>{{ book.title }}</h2>

    <div class="info">
        <strong>Author:</strong>
        <span>{{ book.author }}</span>
    </div>

    <div class="info">
        <strong>Description:</strong>
        <span>{{ book.description }}</span>
    </div>

    <div class="info">
        <strong>Quantity:</strong>
        <span>{{ book.quantity }}</span>
    </div>

    <a href="/" class="btn">← Back</a>
</div>

</body>
</html>
