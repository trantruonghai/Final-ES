<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 12px;
            border: none;
            background: #4A90E2;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #357ABD;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f9fafc;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            transition: 0.2s;
        }

        li:hover {
            background: #eef3ff;
        }

        a {
            text-decoration: none;
            color: #333;
            display: block;
        }

        .empty {
            text-align: center;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Library</h1>

    <form action="/search">
        <input type="text" name="keyword" placeholder="Search book...">
        <button type="submit">Search</button>
    </form>

    <ul>
        {% for book in books %}
            <li>
                <a href="/book/{{ book.id }}">
                    <strong>{{ book.title }}</strong><br>
                    <small>{{ book.author }}</small>
                </a>
            </li>
        {% endfor %}
    </ul>

    {% if books|length == 0 %}
        <p class="empty">No books found</p>
    {% endif %}
</div>

</body>
</html>
