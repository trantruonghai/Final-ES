<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Thông tin cá nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadProfile()">

<div class="profile-container">
    <h2>Thông tin người dùng</h2>
    
    <label for="name">Họ và tên:</label><br>
    <input type="text" id="name" placeholder="Đang tải..."><br>
    
    <label for="email">Email (Không thể sửa):</label><br>
    <input type="email" id="email" disabled><br>

    <div class="button-group">
        <button onclick="updateProfile()">Cập nhật thông tin</button>
        <button onclick="resetPassword()">Đổi mật khẩu</button>
        <button onclick="deleteAccount()" style="background-color: red; color: white;">Xóa tài khoản</button>
    </div>

    <p id="message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
